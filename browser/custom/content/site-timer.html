<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none';"
    />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/custom/site-timer.css"
    />
    <script
      type="module"
      src="chrome://browser/content/custom/site-timer.mjs"
    ></script>
    <title>Site timer</title>
  </head>
  <body>
    <main id="site-timer">
      <h1 id="heading"></h1>
      <p id="summary" hidden></p>
      <section id="wait-step">
        <p id="wait-message"></p>
        <p id="countdown"></p>
      </section>
      <section id="question-step" hidden>
        <h2 id="question"></h2>
        <div id="answers" class="buttons"></div>
      </section>
      <section id="plan-step" hidden>
        <label>
          What are you here to do?
          <input id="purpose" type="text" maxlength="200" autocomplete="off" />
        </label>
        <label>
          How many minutes will it take?
          <input id="minutes" type="number" min="1" max="600" step="1" />
        </label>
        <div class="buttons">
          <button id="start" type="button" disabled>Start</button>
        </div>
      </section>
      <button id="close-tab" class="primary" type="button">Close tab</button>
    </main>
  </body>
</html>
