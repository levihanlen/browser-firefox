<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none';"
    />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/custom/site-timer.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/custom/gatekeeper.css"
    />
    <script
      type="module"
      src="chrome://browser/content/custom/gatekeeper.mjs"
    ></script>
    <title>Gatekeeper</title>
  </head>
  <body>
    <main id="gatekeeper">
      <header>
        <h1 id="heading">Gatekeeper</h1>
        <p id="url"></p>
      </header>
      <section>
        <p id="flagged" hidden>this looks like a distraction</p>
        <label id="minutes-field" hidden>
          <span id="minutes-label">How many minutes?</span>
          <input id="minutes" type="number" min="1" max="600" step="1" />
        </label>
        <h2 id="question"></h2>
        <div id="answers" class="buttons" hidden></div>
        <p id="wait-note"></p>
      </section>
      <button id="leave" class="primary" type="button" hidden>Leave</button>
    </main>
  </body>
</html>
